name: Android verification

on:
    workflow_call:
        inputs:
            version_name:
                type: string
                default: '0.2.0'
            version_code:
                type: string
                default: '1'

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 35
        env:
            ANDROID_VERSION_NAME: ${{ inputs.version_name }}
            ANDROID_VERSION_CODE: ${{ inputs.version_code }}
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.9
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: gradle
            - uses: android-actions/setup-android@v3
            - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
            - run: bun install --frozen-lockfile
            - name: Check shared behavior and release tooling
              run: |
                  bun test apps/web/src apps/worker/tests
                  bun run lint
                  bunx tsc -p apps/worker/tsconfig.json
                  bun run android:test:release
            - uses: actions/cache@v4
              with:
                  path: apps/android/.tools
                  key: bundletool-1.18.3-a099cfa1543f
            - name: Build and verify without release credentials
              run: bun run android:candidate
            - uses: actions/upload-artifact@v4
              with:
                  name: android-candidate-${{ inputs.version_code }}-${{ github.sha }}
                  retention-days: 30
                  if-no-files-found: error
                  path: |
                      apps/android/app/build/outputs/apk/debug/*.apk
                      apps/android/app/build/outputs/bundle/release/*.aab
                      apps/android/app/build/outputs/bundle/release/release-manifest.json
                      apps/android/app/build/outputs/mapping/release/mapping.txt
                      apps/android/app/src/main/play/
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: android-quality-reports
                  path: apps/android/app/build/reports/

    device-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                api: [24, 36]
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.9
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: gradle
            - uses: android-actions/setup-android@v3
            - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
            - run: bun install --frozen-lockfile
            - name: Enable emulator acceleration
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - uses: actions/cache@v4
              if: matrix.api == 24
              with:
                  path: apps/android/.tools/webview-ci-119
                  key: aosp-webview-119-f152c1317fee
            - uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: ${{ matrix.api }}
                  arch: x86_64
                  target: ${{ matrix.api == 24 && 'default' || 'google_apis' }}
                  profile: pixel_2
                  disable-animations: true
                  script: |
                      if [ '${{ matrix.api }}' = 24 ]; then bash scripts/android-prepare-ci-webview.sh; fi
                      timeout 15m bun run android:test:device
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: android-device-reports-api-${{ matrix.api }}
                  path: |
                      apps/android/app/build/reports/androidTests/
                      apps/android/app/build/outputs/androidTest-results/
                      apps/android/app/build/outputs/connected_android_test_additional_output/

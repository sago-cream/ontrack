name: Android checks

on:
    workflow_dispatch:
    pull_request:
        paths:
            [
                '.github/workflows/android*.yml',
                'apps/android/**',
                'apps/web/**',
                'apps/worker/**',
                'assets/android/**',
                'capacitor.config.ts',
                'package.json',
                'bun.lock',
                'scripts/android-*',
                'scripts/AndroidSigningCheck.java',
                'scripts/tests/test_android_*',
            ]
    push:
        branches: [main, 'feat/android-*']
        paths:
            [
                '.github/workflows/android*.yml',
                'apps/android/**',
                'apps/web/**',
                'apps/worker/**',
                'assets/android/**',
                'capacitor.config.ts',
                'package.json',
                'bun.lock',
                'scripts/android-*',
                'scripts/AndroidSigningCheck.java',
                'scripts/tests/test_android_*',
            ]

permissions:
    contents: read
concurrency:
    group: android-checks-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        uses: ./.github/workflows/android-verify.yml

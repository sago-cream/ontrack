name: Android

on:
    pull_request:
        paths:
            - '.github/workflows/android.yml'
            - 'apps/android/**'
            - 'apps/web/**'
            - 'assets/android/**'
            - 'capacitor.config.ts'
            - 'package.json'
            - 'bun.lock'
            - 'scripts/android-*.sh'
    push:
        branches: [main]
        paths:
            - '.github/workflows/android.yml'
            - 'apps/android/**'
            - 'apps/web/**'
            - 'assets/android/**'
            - 'capacitor.config.ts'
            - 'package.json'
            - 'bun.lock'
            - 'scripts/android-*.sh'

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.9
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: gradle
            - uses: android-actions/setup-android@v3
            - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
            - run: bun install --frozen-lockfile
            - run: bun run android:check

    instrumented-test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.9
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: gradle
            - uses: android-actions/setup-android@v3
            - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
            - run: bun install --frozen-lockfile
            - uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 35
                  arch: x86_64
                  disable-animations: true
                  script: bun run android:test:device

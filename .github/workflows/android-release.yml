name: Android Play release

on:
    workflow_dispatch:
        inputs:
            operation:
                description: Candidate needs no secrets; bundle needs signing; upload/promote need Play access
                required: true
                default: candidate
                type: choice
                options: [candidate, bundle, upload, promote]
            version_name:
                description: Display version (ignored for promotion)
                required: true
                default: '0.2.0'
                type: string
            version_code:
                description: New upload version, or exact existing version to promote
                required: true
                type: string
            track:
                description: Destination track
                required: true
                default: internal
                type: choice
                options: [internal, alpha, beta, production]
            source_track:
                description: Source track for promotion
                default: internal
                type: choice
                options: [internal, alpha, beta]
            release_status:
                description: Use draft while completing Console setup
                default: draft
                type: choice
                options: [draft, completed]
            validate_only:
                description: Validate with Google without committing the upload or promotion
                default: true
                type: boolean

permissions:
    contents: read
concurrency:
    group: android-play-release
    cancel-in-progress: false

env:
    ANDROID_VERSION_NAME: ${{ inputs.version_name }}
    ANDROID_VERSION_CODE: ${{ inputs.version_code }}
    PLAY_TRACK: ${{ inputs.track }}
    PLAY_SOURCE_TRACK: ${{ inputs.source_track }}
    PLAY_RELEASE_STATUS: ${{ inputs.release_status }}
    PLAY_VALIDATE_ONLY: ${{ inputs.validate_only }}

jobs:
    verify:
        if: inputs.operation != 'promote'
        uses: ./.github/workflows/android-verify.yml
        with:
            version_name: ${{ inputs.version_name }}
            version_code: ${{ inputs.version_code }}

    signed-bundle:
        if: inputs.operation == 'bundle' || inputs.operation == 'upload'
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 35
        environment: google-play
        env:
            ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/android/ontrack-upload.jks
            ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
            ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
            PLAY_BILLING_PUBLIC_KEY: ${{ vars.PLAY_BILLING_PUBLIC_KEY }}
            PLAY_SERVICE_ACCOUNT_JSON: ${{ github.workspace }}/apps/android/play-service-account.json
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.9
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: gradle
            - name: Prepare credentials and fail early on invalid configuration
              env:
                  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
                  RELEASE_OPERATION: ${{ inputs.operation }}
              run: |
                  python3 - <<'PY'
                  import base64, os, pathlib
                  value = os.environ.get('KEYSTORE_BASE64', '')
                  if not value:
                      raise SystemExit('Missing ANDROID_KEYSTORE_BASE64 in the google-play environment.')
                  path = pathlib.Path(os.environ['ANDROID_KEYSTORE_PATH'])
                  path.write_bytes(base64.b64decode(''.join(value.split()), validate=True))
                  path.chmod(0o600)
                  if os.environ['RELEASE_OPERATION'] == 'upload':
                      path = pathlib.Path(os.environ['PLAY_SERVICE_ACCOUNT_JSON'])
                      path.write_text(os.environ['PLAY_JSON'])
                      path.chmod(0o600)
                  PY
                  java scripts/AndroidSigningCheck.java signing apps/android
                  if [[ "$RELEASE_OPERATION" == upload ]]; then
                      python3 scripts/android-play-credentials.py
                      java scripts/AndroidSigningCheck.java billing apps/android
                  fi
            - uses: android-actions/setup-android@v3
            - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
            - run: bun install --frozen-lockfile
            - uses: actions/cache@v4
              with:
                  path: apps/android/.tools
                  key: bundletool-1.18.3-a099cfa1543f
            - run: bun run android:bundle
            - name: Archive the verified signed bundle before contacting Play
              uses: actions/upload-artifact@v4
              with:
                  name: android-signed-${{ inputs.version_code }}-${{ github.sha }}
                  retention-days: 90
                  if-no-files-found: error
                  path: |
                      apps/android/app/build/outputs/bundle/release/*.aab
                      apps/android/app/build/outputs/bundle/release/release-manifest.json
                      apps/android/app/build/outputs/mapping/release/mapping.txt
                      apps/android/app/src/main/play/
            - name: Validate or upload the archived artifact and listing
              if: inputs.operation == 'upload'
              run: bun run android:upload
            - name: Remove private credentials
              if: always()
              run: rm -f "$ANDROID_KEYSTORE_PATH" "$PLAY_SERVICE_ACCOUNT_JSON"

    promote:
        if: inputs.operation == 'promote'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: google-play
        env:
            PLAY_SERVICE_ACCOUNT_JSON: ${{ github.workspace }}/apps/android/play-service-account.json
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.9
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: gradle
            - uses: android-actions/setup-android@v3
            - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
            - run: bun install --frozen-lockfile
            - run: bunx cap update android
              # The native Gradle dependency project is generated by Capacitor.
              # Promotion does not build or upload a new app bundle.
            - name: Prepare Play credentials
              env:
                  PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
              run: |
                  python3 - <<'PY'
                  import os, pathlib
                  path = pathlib.Path(os.environ['PLAY_SERVICE_ACCOUNT_JSON'])
                  path.write_text(os.environ['PLAY_JSON'])
                  path.chmod(0o600)
                  PY
                  python3 scripts/android-play-credentials.py
            - run: bun run android:promote
            - name: Remove private credentials
              if: always()
              run: rm -f "$PLAY_SERVICE_ACCOUNT_JSON"
